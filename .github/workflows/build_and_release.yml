name: Build & Release Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release (ex: v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Package Android Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk GamepadTesterUltra-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: GamepadTesterUltra-Android.apk

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "GamepadTesterUltra-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: GamepadTesterUltra-Windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Artifact
        run: |
          tar -czvf GamepadTesterUltra-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: GamepadTesterUltra-Linux-x64.tar.gz

  build-web:
    name: Build Web (HTML5/CanvasKit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --base-href "./"

      - name: Package Web Artifact
        run: |
          tar -czvf GamepadTesterUltra-Web.tar.gz -C build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-tar
          path: GamepadTesterUltra-Web.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Gamepad Tester Ultra ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎮 Gamepad Tester Ultra - Suite Professionnelle de Diagnostic Matériel

            ### 🚀 Téléchargements Multiplateformes Disponibles :
            - 🤖 **Android APK** : `GamepadTesterUltra-Android.apk` (Support USB-C OTG, Bluetooth LE/Classic, Télémétrie Batterie & IMU Gyro)
            - 🪟 **Windows x64** : `GamepadTesterUltra-Windows-x64.zip` (Portable, support Raw Input, XInput & DirectInput)
            - 🐧 **Linux x64** : `GamepadTesterUltra-Linux-x64.tar.gz` (Support evdev & standard Gamepad API)
            - 🌐 **Web PWA** : `GamepadTesterUltra-Web.tar.gz` (Déployable statiquement avec HTML5 Gamepad API)

            ### ✨ Fonctionnalités Incluses :
            - 🕹️ **Visualiseur & Simulateur 3D Interactif** (rendu filaire/ombré temps réel avec projection 3D)
            - 🎯 **Laboratoire Stick Drift & Circularité** (Micro-zoom x15, calcul d'erreur Euclidienne, courbe Gamma)
            - ⚡ **Oscilloscope Polling Rate** (120 FPS, gigue jitter en microsecondes, cadence temps réel)
            - 🔋 **Télémétrie Énergie & Batterie** (Courbe de décharge mV, estimation d'autonomie et conso MCU/Rumble)
            - 📳 **Studio Haptique Dual-Motor** (Basses et hautes fréquences, formes d'onde sinusoïdale, impacts)
            - 🔘 **Détecteur de Button Chatter** (Filtrage micro-rebonds mécaniques, matrice N-Key Rollover)
            - 🧙 **Assistant Guidé & Rapport PDF/JSON** (Certification matérielle étape par étape)
          files: |
            release-artifacts/GamepadTesterUltra-Android.apk
            release-artifacts/GamepadTesterUltra-Windows-x64.zip
            release-artifacts/GamepadTesterUltra-Linux-x64.tar.gz
            release-artifacts/GamepadTesterUltra-Web.tar.gz
